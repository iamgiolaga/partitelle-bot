# git-cliff configuration for the "Promote to prod" workflow (.github/workflows/promote.yml).
# Computes the next version and the release notes from Conventional Commits.

[changelog]
header = ""
# Notes only (no version heading): the GitHub release already has a title.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.breaking %} (**BREAKING**){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/partitelle/partitelle-bot/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Never drop a commit: a non-conventional one would be silently lost from the notes.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
# Tags have no `v` prefix (1.3.1).
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"

commit_parsers = [
  # Leftovers of the release-please era and automated lock syncs: not interesting.
  { message = "^chore\\(main\\): release", skip = true },
  { message = "^chore: update uv.lock", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  # Visible, not hidden: a promote that only contains these types still gets non-empty notes.
  { message = "^(chore|ci|docs?|test|build|style|revert)", group = "<!-- 4 -->Other" },
  { message = ".*", group = "<!-- 4 -->Other" },
]

[bump]
# breaking -> major, feat -> minor, anything else -> patch.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "1.0.0"
