name: CI

on:
  push:
    branches:
      - main
  # Manual prod deploy (e.g. a release created by hand in an emergency). Run it on the tag/ref to deploy.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # NOTE: job ids/names are referenced by branch protection required checks, do not rename.
  unit-test:
    runs-on: ubuntu-latest

    # Real Postgres for the feature tests (test/features); same credentials as docker-compose.yml.
    # The suite creates its own `partitelle_test` database and rebuilds its `staging` schema through the real migrations (db/migrate.py).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: partitelle
          POSTGRES_PASSWORD: partitelle
          POSTGRES_DB: partitelle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partitelle -d partitelle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: local
      PB_TG_TOKEN: "123456:TEST"
      PB_DB_HOST: localhost
      PB_DB_PORT: "5432"
      PB_DB_USER: partitelle
      PB_DB_PASSWORD: partitelle
      PB_DB_NAME: partitelle_test
      PB_DB_SCHEMA: staging
      PB_DB_TABLE_NAME: all_players

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Line coverage of the application modules only (not the tests); measured 97% when the gate was added.
        run: >-
          uv run pytest test
          --cov=callbacks --cov=behaviours --cov=jobs --cov=db --cov=utils --cov=handlers
          --cov-report=term-missing --cov-report=xml --cov-fail-under=97

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check

  # Staging: every push to main (after tests and lint) deploys the commit to partitelle-bot-test.
  deploy-test:
    name: deploy-partitellebot-test
    needs: [unit-test, lint]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency:
      group: render-partitellebot-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ github.sha }} to PartitelleBotTest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_TEST_API_KEY }}
        run: .github/scripts/render-deploy.sh "${{ secrets.RENDER_TEST_SERVICE_ID }}" "${{ github.sha }}" main

  # Pre-merge: a PR labeled `deploy-partitellebot-test` is deployed to the test bot (branch + exact head SHA).
  # Same-repo PRs only (fork PRs get no secrets).
  # Tests/lint also run on label events (simple, and guarantees the deploy is gated on green checks).
  deploy-test-pr:
    name: deploy-partitellebot-test-pr
    needs: [unit-test, lint]
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'deploy-partitellebot-test')
      && (github.event.action != 'labeled' || github.event.label.name == 'deploy-partitellebot-test')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: render-partitellebot-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ github.event.pull_request.head.sha }} (${{ github.event.pull_request.head.ref }}) to PartitelleBotTest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_TEST_API_KEY }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: .github/scripts/render-deploy.sh "${{ secrets.RENDER_TEST_SERVICE_ID }}" "$PR_SHA" "$PR_BRANCH"

  # Opens/updates the release PR; when that PR is merged it tags and publishes the GitHub release.
  # Tags/releases made with GITHUB_TOKEN do not trigger other workflows, so the prod deploy below
  # is a job of this same run, gated on `release_created`.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional PAT so release PRs trigger CI; falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot update uv.lock itself, and CI runs `uv sync --locked`:
      # refresh the lock on the release PR branch (no-op when nothing changed).
      # No fromJSON() in step inputs/env: they are evaluated even when the step is skipped,
      # and `pr` is empty when no release PR was created or updated.
      - name: Checkout repository for the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up uv
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@v6

      - name: Sync uv.lock on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          head_branch="$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")"
          if [ -z "$head_branch" ]; then
            echo "No release PR branch in the release-please output"
            exit 0
          fi
          git fetch origin "$head_branch"
          git checkout -B "$head_branch" "origin/$head_branch"
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: update uv.lock for release"
          git push origin "HEAD:${head_branch}"

  # Prod: only when release-please just created a release (exact release commit), or manually.
  deploy:
    name: deploy-partitellebot
    needs: [unit-test, lint, release-please]
    if: ${{ always() && needs.unit-test.result == 'success' && needs.lint.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    concurrency: deploy-partitellebot
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ needs.release-please.outputs.sha || github.sha }} to PartitelleBot
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_SHA: ${{ needs.release-please.outputs.sha || github.sha }}
        run: .github/scripts/render-deploy.sh "${{ secrets.RENDER_SERVICE_ID }}" "$DEPLOY_SHA"
