[project]
name = "partitelle-bot"
version = "1.3.0"
description = "Telegram bot to organize football matches"
readme = "README.rst"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg2==2.9.5",
    "python-telegram-bot==13.11",
    "python-dateutil==2.7.0",
    # apscheduler 3.6.3 (via python-telegram-bot 13.11) imports pkg_resources, removed in setuptools 82
    "setuptools<81",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.7.4",
    "black==24.10.0",
    "pre-commit==3.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
