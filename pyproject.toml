[project]
name = "partitelle-bot"
version = "1.3.0"
description = "Telegram bot to organize football matches"
readme = "README.rst"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-telegram-bot==13.11",
    "python-dateutil==2.9.0.post0",
    # apscheduler 3.6.3 (via python-telegram-bot 13.11) imports pkg_resources, removed in setuptools 82
    "setuptools<81",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.7.4",
    "black==24.10.0",
    "pre-commit==4.7.0",
    "pytest-bdd>=9.0.0",
    "time-machine>=3.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "known-bug: scenario that documents CURRENT (buggy) behaviour; it will need updating when the bug is fixed",
    "payment-reminder: payment reminder feature",
    "issue-8: GitHub issue 8",
    "issue-34: GitHub issue 34",
    "issue-60: GitHub issue 60",
    "issue-61: GitHub issue 61",
    "issue-78: GitHub issue 78",
    "issue-88: GitHub issue 88",
    "issue-89: GitHub issue 89",
    "issue-90: GitHub issue 90",
    "issue-91: GitHub issue 91",
    "issue-92: GitHub issue 92",
    "issue-93: GitHub issue 93",
    "issue-94: GitHub issue 94",
    "issue-95: GitHub issue 95",
    "issue-96: GitHub issue 96",
    "issue-97: GitHub issue 97",
    "issue-99: GitHub issue 99",
]
