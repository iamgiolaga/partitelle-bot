[project]
name = "partitelle-bot"
# Placeholder, never bumped: uv requires a static version (dynamic would make uv build the project metadata, which fails on this flat layout).
# The real version is the git tag created by the "Promote to prod" workflow.
version = "0.0.0"
description = "Telegram bot to organize football matches"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-telegram-bot[job-queue,webhooks]==22.8",
    "python-dateutil==3.0.0",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
    "pytest-bdd>=9.0.0",
    "time-machine>=3.5.1",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The rule set ruff used by default up to 0.7 (ruff 0.17 enables many more by default; adopting them is a separate change).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = [
    "known-bug: scenario that documents CURRENT (buggy) behaviour; it will need updating when the bug is fixed",
    "payment-reminder: payment reminder feature",
    "issue-8: GitHub issue 8",
    "issue-25: GitHub issue 25",
    "issue-34: GitHub issue 34",
    "issue-60: GitHub issue 60",
    "issue-61: GitHub issue 61",
    "issue-78: GitHub issue 78",
    "issue-89: GitHub issue 89",
    "issue-90: GitHub issue 90",
    "issue-91: GitHub issue 91",
    "issue-92: GitHub issue 92",
    "issue-93: GitHub issue 93",
    "issue-94: GitHub issue 94",
    "issue-95: GitHub issue 95",
    "issue-96: GitHub issue 96",
    "issue-97: GitHub issue 97",
    "issue-99: GitHub issue 99",
    "issue-112: GitHub issue 112",
    "issue-128: GitHub issue 128",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
# Gradual typing: only the modules listed in `files` are checked (strictly); everything they import
# is followed silently, so not-yet-typed modules report nothing.
# To bring a module under checking, annotate it fully, add it to `files` and to the strict override.
follow_imports = "silent"
files = ["domain", "db/repository.py", "db/connection.py"]

[[tool.mypy.overrides]]
module = ["domain.*", "db.repository", "db.connection"]
strict = true

[[tool.mypy.overrides]]
# no type stubs / py.typed marker
module = ["yoyo", "yoyo.*", "dateutil", "dateutil.*"]
ignore_missing_imports = true
